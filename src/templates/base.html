<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{pageTitle}}</title>
<meta name="description" content="{{description}}">
<meta name="author" content="{{author}}">
<meta property="og:type" content="{{ogType}}">
<meta property="og:title" content="{{pageTitle}}">
<meta property="og:description" content="{{description}}">
<meta property="og:site_name" content="{{siteName}}">
{{{headExtra}}}
<script>
  // 스타일시트보다 먼저 실행되어야 한다. 분리하면 첫 페인트에서 흰 화면이 번쩍인다.
  try {
    var t = localStorage.getItem('theme');
    if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<link rel="stylesheet" href="{{base}}assets/style.css">
</head>
<body>
<a class="skip-link" href="#main">본문 바로가기</a>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="site-title" href="{{base}}index.html">{{siteName}}</a>
    <nav class="site-nav" aria-label="주요 메뉴">
      <a href="{{base}}tags/index.html">태그</a>
      <button id="theme-toggle" class="theme-toggle" type="button" hidden>
        <svg class="icon icon-system" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
        <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
      </button>
    </nav>
  </div>
</header>

<main id="main" class="wrap">
{{{content}}}
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>© {{year}} {{author}}</p>
  </div>
</footer>

<script src="{{base}}assets/theme.js" defer></script>
</body>
</html>
