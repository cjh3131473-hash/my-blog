<article class="post">
  <header class="post-header">
    <h1>{{title}}</h1>
    <p class="post-meta">
      <time datetime="{{isoDate}}">{{displayDate}}</time>
      <span aria-hidden="true">·</span>
      <span>약 {{readingTime}}분</span>
    </p>
    {{{tagList}}}
  </header>

  <div class="prose">
{{{content}}}
  </div>
</article>

<nav class="post-nav" aria-label="다른 글">
{{{navLinks}}}
</nav>
